<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For Baacha ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Background -->
    <div class="stars"></div>

    <!-- Main Content -->
    <main class="container">

        <p class="small-text">A little surprise is waiting for you...</p>

        <h1>For My Baacha ❤️</h1>

        <p class="subtitle">
            kisika toh bday aane wala h 😝
        </p>

        <!-- Countdown -->
        <div class="countdown">

            <div class="time-box">
                <span id="days">00</span>
                <small>Days</small>
            </div>

            <div class="time-box">
                <span id="hours">00</span>
                <small>Hours</small>
            </div>

            <div class="time-box">
                <span id="minutes">00</span>
                <small>Minutes</small>
            </div>

            <div class="time-box">
                <span id="seconds">00</span>
                <small>Seconds</small>
            </div>

        </div>

        <p class="date">
            26 October 2026 • 12:00 AM
        </p>

        <div class="heart">♥</div>

    </main>

    <script src="script.js"></script>

</body>

</html>
